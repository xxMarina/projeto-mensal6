name: Deploy Frontend (Firebase Hosting)

on:
  push:
    branches:
      - main
      - develop
      - fix/firebase-site-id
    paths:
      - "marmitech-web/**"
      - ".github/workflows/deploy-firebase.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "marmitech-web/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: marmitech-web

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: marmitech-web/package-lock.json

      - name: Instalar dependências
        run: npm install

      - name: Build de produção (Angular)
        run: npm run build -- --configuration production

      - name: Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: projeto-integrador-515322
          entryPoint: marmitech-web

      - name: Exibir URL do Firebase Hosting
        run: |
          echo "### Deploy concluído" >> $GITHUB_STEP_SUMMARY
          echo "Acesse: https://projeto-integrador-515322.web.app" >> $GITHUB_STEP_SUMMARY
          echo "URL da aplicação: https://projeto-integrador-515322.web.app"
