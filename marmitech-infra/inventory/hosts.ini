# =============================================================
#  Inventário Marmitech
#  O Vagrant injeta automaticamente as variáveis de SSH
#  (host, porta, chave privada) neste arquivo ao rodar
#  "vagrant provision" ou "vagrant up".
#  Para rodar o Ansible manualmente (fora do Vagrant):
#    ansible-playbook -i inventory/hosts.ini playbook.yml
# =============================================================

[marmitech_vm]
marmitech ansible_host=127.0.0.1 ansible_port=2222 ansible_user=vagrant

[marmitech_vm:vars]
ansible_ssh_private_key_file=.vagrant/machines/default/virtualbox/private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
